name: Cloudflare Workers AI live test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-image-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_OUTPUT_MAX_DIMENSION: "496"
      CLOUDFLARE_REFERENCE_MAX_DIMENSION: "496"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run local checks
        run: npm run check
      - name: Verify token, generate V1, and edit V2
        run: npm run test:cloudflare
      - name: Upload generated images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-images
          path: debug-output/
          if-no-files-found: error
          retention-days: 3
